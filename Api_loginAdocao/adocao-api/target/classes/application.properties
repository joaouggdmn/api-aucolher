spring.application.name=adocao-api

# ===================== Servidor =====================
server.port=8080

# ===================== PostgreSQL =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/adocao_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / Hibernate =====================
# ddl-auto=update cria/atualiza as tabelas automaticamente a partir das entidades.
# Em produção, prefira usar apenas o script sql/schema.sql e mudar para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================== OAuth2 - Google =====================
# Crie as credenciais em https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:seu-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:seu-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===================== JWT =====================
# Em produção, SEMPRE defina JWT_SECRET via variável de ambiente (nunca versione o segredo real).
app.jwt.secret=${JWT_SECRET:5b8f1a9c2e6d4f7a1b3c5d8e9f0a2b4c6d8e1f3a5b7c9d0e2f4a6b8c1d3e5f7a}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== Logging =====================
logging.level.org.springframework.security=INFO
