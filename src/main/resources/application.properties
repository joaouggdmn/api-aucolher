spring.application.name=aucolher-api

# ===================== Servidor =====================
server.port=8080

# Origens do frontend liberadas no CORS (separe por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Endereço do frontend: para onde a API volta depois do login com o Google
# (/login/google?code=... ou ?error=...)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===================== PostgreSQL =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aucolher_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / Hibernate =====================
# O schema oficial é o sql/schema.sql (cópia de docs/script_banco_aucolher.sql no
# frontend): rode-o antes de subir a API. ddl-auto=validate só confere se o banco
# bate com as entidades — nada de schema criado/alterado por baixo dos panos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================== OAuth2 - Google =====================
# Crie as credenciais em https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:seu-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:seu-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===================== JWT =====================
# Sem segredo versionado: defina JWT_SECRET (mínimo 32 caracteres) no ambiente.
# Se ficar em branco, a API gera uma chave aleatória a cada execução — serve para
# desenvolvimento, mas derruba os tokens emitidos a cada restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== Mercado Pago (PIX das doações) =====================
# O PIX sai com o token da conta Mercado Pago de cada ONG (payment/, OAuth).
# MP_DEV_ACCESS_TOKEN não é mais lido: fica só até o Gate B do plano, como
# reserva do plano B (conta única).
# MP_BASE_URL troca o Mercado Pago por um servidor falso nos testes.
app.mercadopago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
# true só com credenciais de teste: o pagador vai como "APRO" (aprova sozinho).
# O padrão é false para um deploy sem a variável nunca mandar dados de teste.
app.mercadopago.sandbox=${MP_SANDBOX:false}
app.mercadopago.dev-access-token=${MP_DEV_ACCESS_TOKEN:}
# Assinatura secreta dos webhooks (painel do Mercado Pago → Webhooks). Sem ela, todo webhook responde 503
app.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}

# Conta Mercado Pago de cada ONG (OAuth, migração 009). Sem estes valores a API sobe,
# mas conectar a conta responde 503
app.mercadopago.client-id=${MP_CLIENT_ID:}
app.mercadopago.client-secret=${MP_CLIENT_SECRET:}
# Idêntica à cadastrada na aplicação do Mercado Pago
app.mercadopago.redirect-uri=${MP_REDIRECT_URI:}
# Criptografa os tokens no banco (AES-256-GCM): openssl rand -base64 32
app.mercadopago.token-encryption-key=${MP_TOKEN_ENCRYPTION_KEY:}
# true com as credenciais de teste
app.mercadopago.test-token=${MP_TEST_TOKEN:false}
# Assina o "state" do OAuth; sem valor próprio, usa o segredo do JWT
app.mercadopago.state-secret=${MP_STATE_SECRET:${app.jwt.secret:}}

# ===================== E-mail (recuperação de senha) =====================
# SMTP do Gmail (senha de app). Sem MAIL_USERNAME, o conteúdo do e-mail só vai para o log.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Aviso "sua senha foi alterada" (opcional)
app.mail.password-changed-notice=true

# ===================== Logging =====================
logging.level.org.springframework.security=INFO
